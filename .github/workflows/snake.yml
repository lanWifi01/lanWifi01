name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lanWifi01
          outputs: |
            dist/github-snake.svg?color_snake=%231E90FF&color_dots=%23ebedf0,%23cce5ff,%2399ccff,%234da6ff,%230066cc
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%231E90FF&color_dots=%23161b22,%230d2847,%23144970,%231e70b5,%2358a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
