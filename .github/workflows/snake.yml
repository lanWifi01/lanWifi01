name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lanWifi01
          outputs: |
            dist/github-snake-blue.svg?color_snake=#1E90FF&color_dots=#ebedf0,#cce5ff,#99ccff,#4da6ff,#0066cc
            dist/github-snake-blue-dark.svg?palette=github-dark&color_snake=#1E90FF&color_dots=#161b22,#0d2847,#144970,#1e70b5,#58a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
